<script>
const PEOPLE=[
  "刘永琮",
  "黄睿",
  "陈兴",
  "谢航辉",
  "谢源辉",
  "洪燕",
  "廖磊",
  "温泽荣"
];
const ALL=[...PEOPLE];
const QUESTIONS=[
  {
    "id": 1,
    "short": "事态评估",
    "title": "如果你是安德森，在6月28日你对事态作何评估？",
    "lead": "八人都认为应认真处理风险；分歧在于能否认定掺假、如何看待检测，以及先从哪里切入危机。",
    "views": [
      {
        "name": "刘永琮",
        "stance": "基本认定造假，翻转可能性很低",
        "points": [
          "异常低价、研发多次质疑、外部检测和6月25日的新证据持续指向同一结论，很难再用偶然性解释。",
          "事件已超出普通质量问题，升级为消费者信任、企业信誉和法律责任的重大危机。",
          "多年警告没有得到有效处理，暴露出内部管理机制的缺陷。"
        ]
      },
      {
        "name": "黄睿",
        "stance": "关系企业生死的重大食品风险",
        "points": [
          "婴儿食品的敏感性使该事件成为必须高度重视的危机。",
          "从美国法律与追索机制可能造成巨额损失的角度，判断处理方案将决定公司能否生存。",
          "在第2、3问中仍保留“产品是否真的有问题”的不确定性，同时认为假冒果汁的概率偏大。"
        ],
        "note": "最后一点由其第2、3问补充，未将“概率偏大”改写为已经证实。"
      },
      {
        "name": "陈兴",
        "stance": "在毁灭性风险与确定性经营损失间选择",
        "points": [
          "先梳理内部立场：麦金托什谨慎、质疑方法、提醒风险并主张高层决策；斯托勒反应激进、长期忽视预警，主要担忧财务损失。",
          "律师多诺万、马修优先考虑法律风险，回避成品召回并给出继续销售库存的意见；财务副总裁肖传递信息并推动法务介入。",
          "利益相关者包括雀巢（品质与盈利）、婴儿消费者、亨氏与嘉宝等竞争者、FDA和Universal。",
          "继续销售库存，若官方后续证实掺假，可能面临欺诈、罚款、集体诉讼以及品牌和伦理风险；召回销毁则会直接破坏经营目标并冲击职业发展。"
        ]
      },
      {
        "name": "谢航辉",
        "stance": "严重真实性危机，但要区分三类问题",

const SOURCES=[{"file": "商业伦理第二次小组作业_比纳案例分析——廖磊.pdf", "text": "【第1页】\n商业伦理小组作业：比纳营养食品公司案例分析\n（哈佛案例 392-084）\n问题一 如果你是安德森，在 6 月 28 日你对事态作何评估？\n如果我是安德森：自入职这家拥有 80 年历史的比纳公司以来，我已充分了解 1978、1979、1981 年历次质\n量风险记录，也深知过去两年公司为提升品牌形象与产品品质投入了数百万美元。基于此，我会把今天的事态\n提升到战略高度来评估：成立专项跟进小组，实时掌握事件进展，主动制定应对策略，防止事态恶化。我认为\n当前风险极高，必须立即切入摸排与调整；同时也暴露出组织架构问题——相关质量证据已积压两年，却始终\n未被重视。\n问题二 对于安德森来说，驾驭这个局势的困难主要是什么？有多难？谁该对此负责任？\n主要困难有四：一是经营压力，母公司（雀巢）要求扭亏为盈，而更换供应商或封存、召回产品都会直接\n冲击利润；二是管理压力，运营副总裁对质量管理得过且过，从未积极核实苹果汁的真伪，有这样的高管在，\n质量策略很难执行彻底；三是外部压力，事态正朝不可控的方向发展，无论怎么决策都难以两全其美；四是技\n术压力，检测产品是否为 100%纯苹果汁，尚无统一标准。最核心的难点在于取得母公司的支持与充分授权—\n—能否在不受短期利润指标约束的前提下，维护企业的品牌形象。责任主体在安德森与斯托勒身上：安德森作\n为公司第一负责人，负有知人善任之责，任用与企业理念缺乏深度协同的高管，是 CEO 的失职；斯托勒作为运\n营副总裁，对质量和产品负有直接责任。\n问题三 你会建议安德森怎么处理？为什么？\n建议如下：第一，向雀巢如实汇报上述情况，争取大方向上的充分授权，确立“品牌形象与消费者安全第\n一”的原则；第二，调整组织架构，质量负责人直接向 CEO 汇报；第三，立即停止苹果汁采购；第四，封存现\n有涉事产品；第五，与行业协会、媒体保持良好沟通，在积极调查的同时，防止媒体夸大报道损害公司形象。\n品牌是企业最重要的资产，眼前这些损失，都远小于品牌形象受损的代价；消费者的安全高于一切短期财务目\n标。按照利益相关者理论，对消费者诚信，正是对股东长期利益的负责。\n问题四 你猜想安德森会怎么做？为什么？\n从案例的最终结果看，安德森采取的是消极的处理方式——“法无禁止皆可为”，对该事件的处理仅停留\n在沟通了解层面，坐视事态发展，并没有彻底下场挽救。在他的视角里，自己是企业的 CEO，对股东负责、对\n公司的经营利润负责，只要没有明确的证据证明违规，就可以继续做下去。\n小组：＿＿＿＿＿＿＿＿ 组员签名：＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿＿ 日期：＿＿＿＿＿＿"}, {"file": "比纳案例_商业伦理——洪燕.docx", "text": "比纳掺假事件 · 商业伦理四问分析\n事态评估 / 困难与责任 / 建议方案 / 行为预测\n一、如果我是安德森，6月28日对事态作何评估？\n结论：在一个以无糖无添加剂为口碑的营养食品公司，出现加糖的案例投诉，先不论其投诉动因与检测信息的准确性，必须先以“商业诚信的思维”纠察到底。这不是\"疑似掺假\"，而是\"高度可信、且公司内部已被系统性隐瞒近三年\"的掺假事件；真正的危机不是果汁，而是公司已经丧失了自我纠错的能力。\n1. 事实层面：证据已经收敛，不是孤立疑点\n时间\n信号\n强度\n1977起\nUniversal价格比市场低20–25%（1982年每加仑省1.25–1.75美元）\n经济动机\n1978–79\nSIRA（碳稳定同位素比值）检出玉米糖浆\n直接物证\n1979.7\n圣何塞工厂问斯托勒\"假果汁怎么处理\"\n内部已知\n1981.8\n研发总监哈斯金斯备忘录：甜菜糖检不出、果糖/葡萄糖比异常、氨基酸极低、钙钾低10–100倍\n四项独立指标\n1981.12\n雀巢不请自来的报告：译文\"苹果汁是假的，没有看到任何苹果成份\"\n母公司结论\n1982.6.25\nPAI侦探随运货卡车到厂，出示私人实验室检测结果\n外部实锤\n2. 法律与监管层面：我们站在\"知情\"的临界点上\n律师多诺方的建议（等PAI证据确凿再行动、暂不采取任何行动、退回未用浓缩汁但不停售成品）是法律责任最小化建议，不是品牌与伦理建议。\n风险的本质变化：昨天销售是不知者无罪；从今天起——尤其是内部备忘录（哈斯金斯）、雀巢报告都在手上的情况下——继续销售就是\"明知而故犯\"，性质从产品质量问题升级为欺诈与虚假陈述（标签宣称\"100%纯果汁、无糖添加剂\"，售价25美分/瓶，且面向婴儿）。\nPAI随时可能公开或起诉；FDA此前已通过《纽约时报》报道知情。信息不对称是暂时的，曝光是时间问题。\n3. 财务层面：可量化的代价\n库存：约70万箱成品果汁（≈8周供应量）；案例提到销毁/处置成本量级约每箱5美元（≈350万美元）——这是最容易被拿来拖延决策的数字。\n1982年承诺：盈利147万美元；1981年实际亏损约100万美元；现金流目标是\"归零\"。\n母公司压力：雀巢有增长+利润双重要求，不盈利就出售比纳。\n竞争压力：亨氏1982年投入600万美元竞争性要约，专挖比纳客户与货架。\n4. 组织层面：最严重的问题在这里\n麦金托什（质量保障）是斯托勒（运营）的下属，没有独立上报线；\n研发负责人哈斯金斯因提出质疑被斥为\"忧天小鸡\"、\"对公司不忠、没有团队精神\"；\n斯托勒把雀巢的报告转发给了被指控方Universal——等于向涉嫌方通风报信；\n采购走中间商（Interjuice Trading），协议也是与中间商签的，责任链条被刻意拉长。\n→ 评估：这家公司的质量控制体系不是\"失效\"，而是被\"反向使用\"——用来为继续使用低价掺假原料提供程序性掩护。\n5. 品牌层面：不对称的毁灭性\n比纳是第一家宣称去除盐和糖的婴儿食品厂商，4.2盎司一瓶贴着\"100%纯果汁\"\"无糖添加剂\"，1979年《纽约时报》测评13个样品中唯一合格的100%纯苹果汁，广告语是\"如果口味不佳，营养又有什么好？\"。 掺假一旦曝光，被否定的是品牌的全部价值主张，而且受害者是不会说话的婴儿。\n★ 我的答案要点（本人作答）\n在一个以无糖无添加剂为口碑的营养食品公司，出现原材料品质的案例投诉，先不论其投诉动因与检测信息的准确性，必须先以\"无风不起浪\"的质疑思维纠察到底。\n这一答法的力量所在：\n把举证责任归还给企业：投诉方PAI有保护美国果农的自利动机，检测方法也不被FDA/AOAC认可——但这两点只能影响\"证据的证明力\"，不能消灭\"风险的存在性\"。以动机存疑来否定信号，正是斯托勒三年来的错误。\n\"无风不起浪\"是风险管理的默认假设：1978–79年SIRA、1981年8月哈斯金斯四项指标、1981年12月雀巢报告——这不是\"一阵风\"，是连续三次同一方向的信号。\n与企业的价值主张直接挂钩：比纳卖的就是\"纯\"，掺假不是质量问题，是对商业模式的自我否定。因此对纯度的质疑，必须按最高标准纠察，而不是按最低标准\"等证据确凿\"。\n\n二、驾驭这个局势的困难主要是什么？有多难？谁该负责？\n（一）七个结构性困难\n证据悖论（科学 vs 管理）：没有100%准确的检测方法 → 斯托勒以此为由永远\"不动作\"。但管理的举证标准和科学的举证标准不同：企业不能在\"科学上完全确定\"之前，把风险转嫁给婴儿消费者。\n时间压力与法律建议冲突：律师说\"等\"；但库存8周意味着每多卖一天，敞口与\"知情故犯\"的证据链就增厚一天。\n信息阻断：质量向运营汇报、研发被边缘化——斯托勒既是当事人又是调查者。\n财务脆弱：147万盈利承诺 + 雀巢出售威胁 + 亨氏600万挖角，短期财务压力系统性鼓励拖延。\n供应商锁定：找不到符合颜色/质量要求的替代供应商，且Universal便宜25%，停产有成本上升与断供风险。\n母公司关系：雀巢投入6,000万美元升级工厂、寄望美国市场；安德森上任仅一年多，必须向雀巢证明自己——而\"报喜\"的激励极强。\n竞争窗口：任何召回/停产都会被亨氏立刻转化为货架机会，1982年恰逢新生儿增加（355.7万→369.3万）、行业规模突破5亿美元的高景气窗口。\n（二）难度评级：9/10，极高\n不是\"一个两难\"，而是多个两难叠加且互相强化：合法≠合德、短期财务正确≠长期品牌正确、科学不确定≠管理可以不作为、下属不可信但不可替代。\n（三）责任归属（分层，避免\"找一个替罪羊\"的陷阱）\n层级\n责任主体\n责任内容\n程度\n直接\n托马斯·斯托勒（运营副总裁）\n1979年已知SIRA结果、1981.8收到系统性指标质疑、1981.12收到雀巢明确结论，三次机会均选择压制；驳回哈斯金斯、把报告转给Universal、以价格而非质量决策\n主要\n直接\nUniversal / Interjuice Trading\n蓄意掺假、签署\"免受伤害协议\"后仍供应假果汁\n主要\n制度\n组织架构设计\n质量保障隶属运营、无独立上报通道、无供应商审计与留样制度\n根本\n文化\n尼古拉斯时代遗留 + 现金束缚\n\"天然先生\"理想 vs 拖欠供应商数百万、设备80年未更新，形成\"便宜采购优先\"的路径依赖\n中等\n次要\n布鲁斯·麦金托什\n履行了抽检与协议形式，但未能越级上报；组织上本应有独立通道\n次要\n次要\n雀巢\n1981年12月已发出明确报告却无跟进、无闭环\n次要\n当日起\n安德森本人\n此前无责任（上任一年、1981.10才下发雀巢指南、报告未送达他）；但从6月28日知情起，责任转移到他身上\n未来责任\n核心判断：责任不能止于\"斯托勒一个人坏\"。真正的问题是一个让诚实者（哈斯金斯）付出代价、让隐瞒者（斯托勒）得到奖励的激励与组织系统。\n★ 我的答案要点（本人作答）\n①个人利己主义——安德森作为CEO，先思考的是扭转局势、完成业绩承诺，而不是公司的使命与价值观； ②运营经理对研发意见的阻拦——不是互相协同，而是压制。\n这两点的深度解读与可引用论据：\n① CEO的认知排序错位（安德森自己的困境）\n他此时的心理账户里，优先级是：1982年盈利147万 → 现金流归零 → 雀巢\"不盈利就出售\" → 亨氏600万挖角。\n但他上任后的第一件事是自己买一购物车产品尝、\"太难吃了\"；第二件事是下发雀巢产品指南；第三件事是无钠无糖的营销主张——他最初的身份是质量捍卫者，而在这一天被财务目标挤到了第二位。\n关键洞察：困难不在外部，而在CEO内心的排序。一旦把\"保业绩\"放在\"保真\"之前，后面所有动作都会被扭曲（等证据、继续卖库存、听律师的）。这正是\"渐进式不道德\"的起点。\n② 运营压制研发：跨职能协同失败（斯托勒与哈斯金斯）\n事实证据：哈斯金斯以四项独立指标（甜菜糖检不出、果糖/葡萄糖比、氨基酸水平、钙钾低10–100倍）+ 价格低于市场25%提出质疑；斯托勒的回应不是反驳证据，而是攻击动机——\"对公司不忠\"\"没有团队合作态度\"\"忧天小鸡\"\"天真的理想主义\"。\n这是一次典型的动机质疑替代事实辩论（ad hominem）：当证据无法反驳时，就贬低提出问题的人。\n结构性成因：两条汇报线不对等——研发/质量保障是运营副总裁的下属，成本与交付由运营负责，质量没有否决权。于是\"质量\"不是制衡力量，而是运营内部的一个建议部门。\n后果量化：一次压制 = 直接省下20–25%采购成本避免了改善Versus upsetting current status quo; 三次压制 = 长达三年的系统性掺假与后来的刑事判决。\n③ 结论：困难的根源不是\"一个坏人\"，而是业绩导向的个人理性 + 无制衡的组织结构，二者叠加，使说真话的成本高于说假话的成本。\n\n三、我会建议安德森怎么处理？为什么？\n总原则：把\"被揭露\"变成\"主动报告\"。这是唯一能同时保住监管信任、母公司信任与品牌根基的动作。\n立即（24小时内）\n冻结，不是销毁：立即停止一切含Universal浓缩汁成品的销售与发运（含70万箱库存），隔离待检。\n→ 理由：继续销售的边际收益是\"多赚几周的钱\"，边际成本是把自己从\"受害者\"变成\"共谋\"。这是不可逆的转折点。\n独立取证：委托AOAC认可方法的第三方权威实验室，对所有批次留样复检；完整保全哈斯金斯备忘录、雀巢报告、斯托勒转发的记录——这是未来的证据链。\n切断供应商：停止向Universal与Interjuice采购；审计以色列产地与皇后区混配工厂；依\"免受伤害协议\"启动索赔。\n主动通报FDA并邀请其参与检测——把监管方从\"未来的起诉者\"变成\"当下的合作方\"。\n一周内\n组织重组：质量保障（麦金托什）改为直接向CEO汇报；设立独立召回委员会；建立供应商准入审计 + 每批留样 + 盲样抽检三项制度。\n对雀巢：48小时内主动、完整汇报（不等其发现），提交整改方案与财务影响测算，争取雀巢全球研究资源与危机公关支持。\n对外预案：消费者沟通口径、免费客服热线脚本、连锁零售客户一对一沟通——抢在媒体报道之前。\n财务与母公司\n主动重做1982预算：把召回/销毁（约350万+）与停产损失显性化，向雀巢申请豁免147万盈利承诺。\n→ 理由：雀巢真正在意的是美国市场战略（1985年30%业务来自美国）与品牌声誉，不是比纳一年的利润。主动上报的CEO比被动暴露的CEO更安全。\n关于是否加入PAI诉讼\n暂不加入，但保留权利。 先完成自查与取证再决定。仓促加入会把公司拖入与供应商的诉讼缠斗，反而延迟自查与整改，并且PAI的动机本身（保护美国苹果种植者）并不纯粹。\n为什么这样处理（四个理由）\n利益相关者排序：婴儿消费者 > 监管信任 > 母公司信任 > 短期利润。当受害者是不会说话的婴儿时，举证责任在企业，不在消费者。\n期权不对称：等待的收益有限（几周毛利），等待的损失无限（刑事、品牌、执照）；主动停产的代价有限、可量化、且可由雀巢消化。\n时间站在曝光一边：PAI、FDA、《纽约时报》三条线都会推进，早一天主动 = 多一分主动权。\n历史对照就在两个月后：1982年9月强生泰诺主动召回，品牌信任不降反升；而拖延型案例（福特Pinto、A.H. Robins的Dalkon Shield）均以毁灭收场。\n★ 我的答案\n①销售端立即停止销售，上新产品； ②切断供应商、寻找新供应链，并蹲点供方，获取原供应商欺诈的证据，依据合同条款追溯损失； ③独立质检，取得可靠的供方欺诈依据； ④上报雀巢总部，说明当前情况与规划方案，并承担管理全责。 原因：作为一把手，核心是——面对危机时调用所有资源处理问题的能力，以及面对大是大非时从公司战略与价值观出发的决策力。\n为什么这套方案比\"停售+召回\"更进一步（四点深层理由）：\n①②是止血，③是定性，④是定责——四步构成完整闭环：\n停售新品替代 = 保住货架（不给亨氏600万挖角的机会窗口）；\n切换供应链并蹲点取证 = 同时解决\"以后怎么办\"和\"谁赔钱\"；\n独立质检 = 把主观怀疑变成可采信证据，这是所有后续法律与沟通动作的地基；\n上报雀巢 + 承担全责 = 把母公司变成同盟而非审判者。\n\"蹲点供方\"是关键的动作设计：掺假的证据在供应商现场（以色列产地、皇后区混配厂），不在比纳实验室；只有现场取样才能形成闭环证据链，也只有这样才能真正触发\"免受伤害协议\"的索赔条款。\n\"承担管理全责\"是最高级的一步：多数CEO在这一步会本能地切割（\"这是前任/运营副总的问题\"）。但主动承担全责换来的是雀巢的信任与资源调用权——6,000万美元的升级资金、全球研发机构、危机公关能力，全部可以为他所用。肯担责，才配调用资源。\n回应\"决策力\"这一定义：在大是大非面前，决策依据不是P&L，而是公司战略与价值观——比纳是雀巢打入美国市场的质量旗舰，\"纯\"就是它的战略本身。这是唯一的、也是不可让渡的判断标准。\n\"处理危机的能力，不等于止损的技巧，而是有勇气在当天就承担全部责任、并把资源全部押上去的能力； 决策力的来源也不是计算，而是清楚地知道这家公司靠什么活着。\"\n〔待补〕第4问（\"你猜想安德森会怎么做？为什么？\"）尚未提供你的作答，可在课堂上沿用上文\"最可能路径：折中拖延\"的判断。推测依据提醒：案例结尾刻意强调\"PAI证实尚需几周\"与\"库存还够卖8周\"，这两句正是拖延决策的合理化框架；加上律师马修明确背书\"可以继续销售库存成品\"，多数管理者会选择折中而非彻底召回。\n\n四、猜想安德森会怎么做？为什么？\n最可能的路径：折中拖延——不停售、不召回，退回未使用浓缩汁、内部复检、等权威结果\n预测依据：\n文本线索：案例结尾写他\"对当前的状况以及成品苹果汁的库存问题进行了深入的思考和判断\"，并特别强调两点——\"PAI的检测得到权威机构证实尚需几周\"、\"仓库中还有70万箱成品，约8个星期的供应量\"。这两句正是拖延决策的合理化框架：等证据 + 库存还能卖8周。\n律师的明确背书：马修回答\"比纳公司可以继续销售库存的成品苹果汁\"——有了法律意见，管理者几乎不可能选择更激进的路径。\n禀赋效应与确定性偏好：召回损失是确定的350万+，曝光是概率性的。人对确定损失的本能反应是拖延。\n\"渐进式不道德\"的滑坡：1979、1981.8、1981.12 三次跨过红线都没有任何后果（甚至《纽约时报》还把比纳评为第一）。前三次的无后果，构成了第四次不作为的惯性。\n执行链缺失：斯托勒会抵制任何停产决定，安德森上任一年多，缺乏可信赖的替代执行者。\n次高概率路径：主动向雀巢汇报并部分停产（约30%概率）。理由是他由雀巢派出、丹麦背景、上任第一件事就是尝自家产品、下发雀巢产品指南，质量价值观明确；一旦雀巢介入，其标准会强制要求停产。\n历史验证：真实结局是公司继续销售含假果汁的产品数月，后被FDA介入；1987年比纳认罪并支付罚款，相关高管被判刑——说明\"折中拖延\"正是实际发生的选择，也是这个案例被写入商业伦理课程的原因。\n\n\"这个案子里，掺假不是问题，沉默才是问题——三次预警、三份报告，都被组织消化掉了。\"\n\"当检测方法不确定时，企业不能把举证责任推给消费者；举证责任在购买原料的那一刻就在买方身上。\"\n\"短期看，召回的成本是350万美元；长期看，不召回的成本是公司本身。安德森真正要管理的不是果汁，而是公司说真话的能力。\""}, {"file": "比纳营养食品公司案例解答——谢源辉.docx", "text": "比纳营养食品公司案例\n背景\n比纳主营婴儿食品，苹果汁占销售额 30% 且标签\"100% 纯果汁、无糖\"；雀巢并购后要求扭亏。6/28 安德森得知主力供应商 Universal 浓缩苹果汁疑似糖水掺假，仓库尚存由其调制的成品约 70 万箱（8 周供应），而 PAI/FDA 检测方法尚未获官方采纳。\n问题一：如果你是安德森，在 6 月 28 日你对事态作何评估？\n\n紧急：低\n紧急：高\n严重：高\n计划治本\n·独立第三方权威检测\n·QA独立于运营的治理重构\n·长期质量体系修复\n立即优先\n·停售/隔离70万箱库存\n·断供Universal+替代供应商\n·下架问题成品\n严重：低\n监控搁置\n·历史旧账(SIRA)复盘\n·核实PAI动机\n快速授权\n·律师/PAI诉讼协调\n·与雀巢沟通口径\n最棘手为右上\"继续销售掺假库存\"（高严重·高紧急），须当天第一优先；\"独立检测/治理重构\"虽严重但属排期治本项。掺假可能性高（价格低25%、果糖/葡萄糖1:1、SIRA两次异常、雀巢报告），但官方认证缺，应假定最坏并立即独立核实。\n问题二：驾驭局势的困难、难度与责任归属\n困难：信息不确定（无权威检测法、PAI未获官方采纳）、70万箱与时间压力、财务脆弱（召回或触发雀巢出售）、QA隶属运营的职能错位、下属建议矛盾、伦理-商业张力。\n难度：极高（典型 wicked problem），无完美解——最严则重创财务，最松则把糖水喂给婴儿。\n责任：主责斯托勒（长期忽视红旗、压制QA）；次责QA/研发（未越级上报、无定论检测）；安德森终责（过度下放质量）；系统责（雀巢松散监管、QA向运营汇报）；源头 Universal 掺假。\n问题三：建议安德森如何处理？为什么？\n1 立即断供 Universal，启用第二供应商保供应。\n2 委托 FDA 认可实验室独立复检，定事实基础。\n3 70万箱隔离而非继续销售（对婴儿负责）。\n4 QA 独立于运营、设越级上报通道。\n5 主动通报 FDA、配合诉讼、透明沟通雀巢、做财务预案。\n理由：婴儿安全/欺诈风险远大于短期财务；品牌信誉不可逆；价格、理化、历史检测等旁证已足支撑\"先防后证\"。\n问题四：你猜想安德森会怎么做？为什么？\n更可能\"低调拖延、财务优先\"：继续销售库存、quietly 换供应商、不主动通报 FDA、把处置交回运营线。\n依据：雀巢\"不盈利就出售\"生死压力；长期放权斯托勒；PAI 不确定性被用作缓冲；律师\"避免公众注意\"提供合规外衣。\n小结\n核心张力 = 短期财务生存 vs 产品诚信（对婴儿责任）；深层病灶 = QA 隶属运营的治理错位与长期失灵的预警。理想应对：假定最坏、独立验证、隔离敞口、修复治理、主动透明。"}, {"file": "比纳营养食品公司案例解答——谢航辉.txt", "text": "1．如果我是安德森，6月28日会如何评估事态？\n\n这已经是需要立即处理的产品真实性危机。低价采购、历年的检测异常、研发人员的多次提醒，以及PAI提供的新证据，共同构成了严重的掺假嫌疑。虽然检测方法尚未获得官方采纳，也没有消费者伤害报告，但这些都不足以证明产品符合“100%纯苹果汁”的承诺。尤其产品面向婴幼儿，家长很难自行判断成分，公司应当承担更高的审慎责任。同时，应区分掺假嫌疑、标签是否真实和健康风险，分别核查，避免过早下结论。\n\n2．安德森面临的主要困难是什么？有多难？谁应负责？\n\n困难在于，他必须在证据尚有争议时，作出可能造成明显损失的决定。公司经营承压，库存成品约值70万美元，约相当于半个月供应量，停销会影响利润和供货；继续销售则可能扩大消费者损失和品牌风险。长期合作关系、供应商的保证，以及内部层级对信息的筛选，也增加了判断难度。\n\n如果供应商确实掺假，应承担直接责任；公司内部收到异常报告后为何没有充分调查，也需要追查。麦金托什等提出疑虑的员工，应与忽视或压下问题的人区别对待。安德森此前未必掌握全部信息，但从6月28日起，他必须承担组织调查和决定产品去向的管理责任。\n\n3．我会建议安德森如何处理？为什么？\n\n维持停止向Universal采购的措施，立即隔离可疑原料及相关成品，暂停销售涉及这些原料的批次。同时保存合同、检测记录和往来文件，委托独立机构复检，追溯受影响批次，并向母公司和董事会完整报告，及时与监管机构沟通，依据核查结果确定召回范围和消费者告知方式。\n\n调查还应核实供应商的实际生产条件，以及内部历次警告如何被处理。今后应让质量负责人能够独立上报重大风险，并对异常低价采购加强审核。供应商的赔偿承诺只能分担部分经济损失，无法替代比纳对消费者和品牌承诺的责任。\n\n4．我猜安德森会怎么做？为什么？\n我认为，他较可能继续停止采购，但暂时销售库存，等待更明确的检测或监管结论。公司面临利润压力，库存损失明显；斯托勒持续淡化问题，律师又认为现有证据不足以支持诉讼，这些因素都容易让他选择等待，他可能把“尚未证实有害”当作继续销售的理由。"}, {"file": "比纳营养食品公司案例解答——陈兴.txt", "text": "一、如果我是安德森，6月28日对事态作何评估？\n1.【各方信息、观点和态度】\na-质量部门,麦金托什：谨慎客观，质疑检测方法，提醒风险，主张高层决策，不激进。\nb-运营部门,斯托勒：现场反应激进，历史上长期忽视预警，核心顾虑是公司财务损失。\nc-法务代表,律师多诺万、马修：法律风险优先，但回避成品召回，给出可以继续售卖库存的法律意见。\nd-财务副总裁,肖：信息传递者，推动启动法务介入。\n\n2.【利益相关方】\n雀巢（品质和盈利）；消费者（婴儿）；竞争对手（亨氏、嘉宝）；FDA；供应商Universal；\n\n3.【事态影响】\n如果保守，选择继续销售库存：有概率面临不可承受毁灭性风险。一旦后续官方证实果汁掺假，面临欺诈，巨额罚款，消费者集体诉讼，品牌与伦理风险。\n\n如果激进，选择召回销毁：目标铁定不可达成，职业滑坡。\n \n二、驾驭这个局势的困难主要是什么？有多难？谁该负责？\n【多角度】\n安德森既要面对财务压力，也要面对法律风险、产品质量、品牌声誉、内部管理多重矛盾。\n【核心困难】\n具体事件上面临的核心困难：证据困境，无法证伪掺假；部门立场分裂；多重利益相关方互相拉扯；\n【责任】\n担责方面，安德森是最终负责人，承担决策责任；斯托勒对产品质量和管理责任；供应商Universal涉及欺诈；雀巢母公司有目标指定责任。\n \n三、我会建议安德森怎么处理？为什么？\n【短期】\n短期：成立高级别的专门调查组，解决内部信息盲区；产品暂停投放；寻找第三方检测；明确法律风险；向雀巢总部如实汇报\n【长期】\n中长期：内部治理、制度整改\n \n四、猜想安德森会怎么做？为什么？\n【他不会选择停下】\n结合案例原文里安德森的性格和现实约束，大概率向经营目标妥协，库存成品不封存不召回，没有明确证据，内部派系分明，他又刚landing，既然律师给了底线，我认为他优先保证目标达成。"}, {"file": "比纳营养食品公司案例解答——黄睿.txt", "text": "1、 如果你是安德森，在6月28日你对事态做何评估？\n涉及食品安全问题，特别是婴儿食品，是一个巨雷，鉴于美国法律和追索机制的巨额损失，该问题的解决方案是决定公司生死的决策。\n \n2、 对于安德森来说，驾驭这个局势的困难时主要是什么？有多难？谁该对此负责任？\n不确定产品是否真的有情况下，需要在企业利润和企业长期发展的利害关系中决策。很难：发展问题和生存问题。该企业组织架构存在一定问题，涉及企业生死的质量部无法直接反馈真实情况至决策层，供应链把控风险能力较弱，但各部门均为出现明显失责情况。责任主要在CEO组织管理能力。\n \n3、 你会建议安德森怎么处理？为什么？\n在一个非常成熟的法治社会，且处于非常敏感的婴儿健康食品行业，出现问题可能直接导致一家企业直接破产，建议按及时止损、及时控制事态的方式处理，结合文章内反馈的情况、假冒果汁的概率偏大，建议及时召回产品、等待检测结果，有可能短时间内丢掉一定的市场份额，丢掉和雀巢的业绩承诺，但至少保证了该企业可持续经营和发展。\n \n4、 你猜想安德森会怎么做？为什么？\n安德森是职业经理人，背负绩效考核压力，可能会选择折中方案，暂停销售、等待检测结果。尽可能得在检测结果没有证实的情况下，稳定公司经营、减少损失。为什么？职业经理人不背负一家的存亡只负责任期内的经营结果。"}, {"file": "比纳营养食品案例分析——刘永琮.docx", "text": "一、如果你是安德森，在6月28日你对事态作何评估？\n如果我是安德森，我基本会认定苹果汁原料存在造假问题，后续翻转的可能性很低。\n供应商长期以明显低于市场的价格供货，研发部门多次提出质疑，外部实验室的检测结果也不断强化造假嫌疑。特别是6月25日，调查人员再次提供相关证据。不同时间、不同来源的信息持续指向同一结论，已很难用偶然性解释。\n因此，我认为这已经不是普通的质量问题，而是涉及消费者信任、企业信誉及法律责任的重大危机。同时，多年警告未得到有效处理，也暴露出企业内部管理机制的缺陷。\n二、对安德森来说，驾驭这个局势的困难主要是什么？有多难？谁应该对此负责？\n我认为局势非常难处理，但困难不在于判断造假是否存在，而在于承担纠正错误的代价。\n主要存在五个方面的困难：一是证据虽然高度指向造假，但涉及批次、责任主体等仍存在不确定性；二是立即停售和召回会造成巨额库存损失，直接冲击经营目标；三是斯托勒长期掌握采购和生产权力，研发人员的警告多次被忽视，内部存在较大组织阻力；四是雀巢收购比纳后要求改善盈利，管理层承受较大业绩压力；五是承认问题意味着否定过去的经营决策，甚至可能影响安德森自身的职业声誉和法律责任。\n其中，我认为第五点最难。安德森此前已经收到相关警告，此时承认问题，就必须解释过去为什么没有采取行动。因此，正确决策的方向并不难判断，真正困难的是承担相应的经济和管理责任。\n责任方面，供应商应承担造假的直接责任；斯托勒应承担采购及质量管理责任；安德森作为总经理，应承担最终决策和监督责任；雀巢也需要审视其经营考核和监督机制。至于多次提出警告的研发人员，不应成为主要责任承担者。\n三、你会建议安德森怎么处理？为什么？\n我建议立即暂停涉事产品的生产、发货和销售，封存库存并追溯涉及批次。同时成立独立调查小组，引入外部检测机构，主动向雀巢和监管部门说明情况，根据调查结果实施必要的召回。随后尽快寻找替代供应商，恢复正常生产，向造假供应商追索损失，并追究内部管理责任。\n理由在于，已经形成的库存损失不会因为暂时不承认问题而消失。继续销售虽然可能减少眼前损失，却会扩大潜在的法律和品牌风险。企业应尽可能控制损失，但不能通过向消费者转移风险来减少损失。\n四、你猜想安德森会怎么做？为什么？\n我猜想安德森更可能采取折中甚至拖延的方式：停止新增采购、继续调查，但不立即全面召回。\n原因有三点：一是不愿承担召回带来的确定性经济损失；二是不愿否定过去的管理决策，暴露自身责任；三是存在侥幸心理，希望后续调查推翻不利证据，或者认为即使存在掺假，也未必造成严重后果，甚至希望通过时间逐步消化库存。\n我认为安德森并非没有认识到风险，而是过度重视眼前确定的损失，低估未来不确定的法律和声誉风险，同时高估了自己控制事态的能力。"}, {"file": "比纳食品案例分析（温泽荣）(1).docx", "text": "1.如果我是安德森，6月28日我对事态的评估。\n我认为我需要谨慎对待此次事件，不能对前景过于乐观。一方面，无论目前公司采购的浓缩苹果汁是否真正掺假，该问题已直接触碰到公司“纯天然”、“无添加”、“高营养”的经营核心，是公司的安身立命之本。另一方面，现在我可以从不同渠道接收到信息，不限于侦探拜访、Universal实地考察结果、原供应商的提醒、苹果汁检测异常结果等，内部和外部警告多次出现，这些线索都间接指向渗假问题，说明浓缩果汁渗假是具备相当可能性的。更值得注意的是，目前不存在有效、可靠的，能直接定性苹果汁是否掺假的技术和方法，说明我应客观地质疑所有往年的科研检验结果。\n2.驾驭这个局势的困难是什么？有多难？谁该为此负责任？\n困难一：自身专业储备不足。安德森对浓缩果汁知之甚少，且对工厂的实际组织架构运行情况不了解，导致其在处理该事件过程中，要通过非常片面的信息做出决策。困难二：盈利指标压力。公司距离与雀巢公司签订的盈利目标仍有较大差距，暂且不提坚持正常销售能否达到盈利目标，所有针对涉浓缩苹果汁产品的涉假处置方案，都显而易见将进一步拉高成本和损失。困难三：无法形成统一共识和意见。质量保障部、研发部与副总裁斯托勒均有较大的意见分歧，截至6月28日仍未就分歧进行充分的研究和讨论。同时，安德森向法务部门咨询过程中，事务所本身前后提出的建议也有很大差别。以上困难都很难，安德森目前是无法形成有效决策的。安德森需要为此负责，一是他没有抽出足够的时间，与斯托勒调研生产中涉及的实际问题，二是他缺乏与雀巢公司的良性沟通，未与雀巢公司就浓缩果汁的顾虑进行讨论，三是设定的预期盈利不够合理，未保留冗余。斯托勒需要为此负责，一是他作为负责生产链条管理的副总裁，未能客观地评估各部门给出的意见和建议，对研发部的汇报持有明显的情绪化意见，二是作为两个工厂的直接负责人，虽然听取了麦金托什的意见，由总裁决定是否加入集体诉讼，但他没有第一时间向安德森汇报工厂情况，三是他没有重视雀巢公司对于苹果汁的质疑报告，而是单纯将报告转发，未继续追查。\n3.建议？\n①向雀巢公司报告现有质量风险，对预期的盈利下降做出合理解释，从保证产品质量的角度获得雀巢公司的认可；②立刻召开紧急会议，组织架构中前三级管理层人员均需参加，就该问题同步信息和意见，确保没有重要线索遗漏。③立刻寻找可代替的浓缩苹果汁供应商，替代存疑原供应商的浓缩果汁存货，并逐步停止售出原库存，售卖新供应商提供原料支撑的果汁。④要求律师事务所介入此前的质疑报告，深入调查Universal公司。\n4.猜想？\n我猜想安东森会继续照常销售库存果汁，并继续等待其余部门的调查结果，以及PAI检测的证实结果。待该月的盈利数据达标后，再做出决策。"}];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const sourceFor=n=>SOURCES.find(s=>s.file.includes(n));
const tags=names=>`<div class="names">${names.map(n=>`<button class="name-tag" onclick="showSource('${n}')" title="查看${n}原文">${n}</button>`).join('')}</div>`;
function renderSidebar(){document.getElementById('sidebar').innerHTML=`<div class="nav-label">讨论导航 / INDEX</div><button class="nav-item ${current===0?'active':''}" onclick="go(0)" ${current===0?'aria-current="page"':''}><span class="n">◎</span><span class="txt">讨论总览<small>THE BIG PICTURE</small></span></button>${QUESTIONS.map(q=>`<button class="nav-item ${current===q.id?'active':''}" onclick="go(${q.id})" ${current===q.id?'aria-current="page"':''}><span class="n">0${q.id}</span><span class="txt">${q.short}<small>${['ASSESSMENT','CHALLENGES','RECOMMENDATIONS','PREDICTIONS'][q.id-1]}</small></span></button>`).join('')}<div class="source-nav"><button class="nav-item ${current===5?'active':''}" onclick="go(5)" ${current===5?'aria-current="page"':''}><span class="n">≡</span><span class="txt">来源与核对</span></button></div><div class="sidebar-note"><span class="tiny-dot"></span>完整保留32组回答<br>共同点标明支持者；<br>不同点区分立场与侧重。<br><br>点击姓名或“核对原文”，<br>可查看完整来源。</div>`;}
function personCards(q){return `<div class="view-grid">${q.views.map(v=>`<article class="person-card ${v.name==='洪燕'?'long':''}"><div class="person-top"><span class="avatar">${v.name[0]}</span><span class="person-name">${v.name}</span><span class="doc-type">${sourceFor(v.name).file.split('.').pop().toUpperCase()} · Q${q.id}</span></div><h3>${esc(v.stance)}</h3><ul>${v.points.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>${v.note?`<div class="card-note">${esc(v.note)}</div>`:''}<button class="source-link" onclick="showSource('${v.name}')">核对完整原文 <span aria-hidden="true">↗</span></button></article>`).join('')}</div>`;}
function commonCards(q){return `<div class="consensus-list">${q.common.map((c,i)=>`<article class="consensus ${c.names.length<Math.ceil(PEOPLE.length*.75)?'minor':''}"><div class="c-icon">${c.names.length===PEOPLE.length?'✓':String(c.names.length)}</div><div><span class="badge">${esc(c.level)}</span><h3>${esc(c.title)}</h3><p>${esc(c.body)}</p>${tags(c.names)}</div></article>`).join('')}</div>`;}
function diffCards(q){return q.diff.map((d,i)=>`<article class="difference"><div class="diff-title"><span>0${i+1}</span><h3>${esc(d.title)}</h3></div>${d.groups.map(g=>`<div class="group"><div><div class="group-label">${esc(g.label)}</div>${tags(g.names)}</div><p>${esc(g.body)}</p></div>`).join('')}${d.note?`<div class="card-note">${esc(d.note)}</div>`:''}</article>`).join('');}
function overview(){let common=['事态已超出普通采购或质量问题。','经营压力、组织问题与CEO责任交织。','重视质量处置，但停售节奏不一致。','实际选择可能比理想方案更保守。'];let split=['“基本坐实”还是“严重嫌疑”？','难在承担代价，还是难以形成有效决策？','立即控制销售，还是换供方后逐步停售？','暂停销售，还是继续消化库存？'];return `<div class="overview-intro"><div class="eyebrow">Discussion Map / 讨论地图</div><h2>共识在风险与责任，<br>分歧在判断与行动。</h2><p>这份归纳不替小组“统一答案”。每道题保留八位同学的推理，再把相近观点合并、把真正的差异并列，方便课堂展示与继续讨论。</p><span class="arrow" aria-hidden="true">↘</span></div><div class="overview-grid">${QUESTIONS.map((q,i)=>`<button class="overview-card" onclick="go(${q.id})"><span class="num">0${q.id}</span><h3>${q.short}</h3><p><strong>共同点</strong>${common[i]}</p><p class="split"><strong>看差异</strong>${split[i]}</p><span class="go">逐人观点 · 共同认同 · 不同看法 &nbsp; →</span></button>`).join('')}</div><div class="method-box"><h3>八位同学 · 八份原稿</h3><div class="participants">${PEOPLE.map(n=>`<button onclick="showSource('${n}')">${n} ↗</button>`).join('')}</div><p style="margin-top:16px">“全体共同方向”是八份讨论支持的上位归纳；具体措施不因此被视为八人一致。多数共同项另标支持者；未提及不等于反对。</p><p>新增温泽荣作答，已重审共识范围；原稿中的库存口径、知情前提及“本人作答／扩展分析”差异继续保留。<button class="link-btn" onclick="go(5)" style="color:var(--wine);font-size:12px">查看核对说明 →</button></p></div>`;}
function sourcePage(){return `<div class="page-head"><div class="chapter"><span class="big">≡</span><h2>来源与核对</h2></div><p class="lead">以工作目录中的8份署名文件为观点来源。参考聊天用于理解四问背景，不另计为第9位发言者。</p></div><div class="source-list">${PEOPLE.map(n=>`<div class="source-row"><strong>${n}</strong><span class="filename">${esc(sourceFor(n).file)}</span><button onclick="showSource('${n}')">查看原文 ↗</button></div>`).join('')}</div><div class="notice"><h3>完整性与归纳口径</h3><p>逐人归纳覆盖8人×4问，共32组回答；每问分别整理个人观点、共同认同、不同看法。重复论证合并表达，特别的建议、理由、责任边界和备选情景保留。原文全文可随时核对，原始文件也可下载。</p><p>共同点注明支持者及适用范围，区分“全体共同方向”“多数明确主张”和少数补充项。标签表示文本依据，不代表投票或八人逐条表决。跨题借用的观点会注明；没有提及某措施，不当作反对该措施。</p><p>这些内容是同学对历史案例的分析与预测。本页没有将同学的法律判断、金额估算、概率或事后叙述升级为独立核验的事实。</p></div><div class="notice"><h3>本次增补 · 温泽荣</h3><p>新增四问完整作答，并重新核对八人的共同点和分歧。温泽荣强调专业与信息不足、检测局限，建议更换供应商并逐步停止原库存销售，预测当月盈利达标后再作决策。</p><p>第3问的“立即控制销售”保留为7/8人的共同项，不再标为全体共识；第4问“律师意见支持继续经营”现为4/8人的共同解释，不再标为多数。其余新增内容分别融入对应题目的观点与差异对照。</p></div><div class="notice"><h3>需要保留的来源差异</h3><table class="audit-table"><thead><tr><th style="width:20%">核对项</th><th>原稿情况</th><th style="width:29%">本页处理</th></tr></thead><tbody><tr><td>库存口径</td><td>谢航辉：约值70万美元、半个月供应量。谢源辉与洪燕：约70万箱、8周供应量。洪燕另估处置成本约350万美元。</td><td>不合并、不求平均，不以任何一稿替其他人纠错；保留来源归属。</td></tr><tr><td>历史知情与责任</td><td>刘永琮、廖磊认为安德森此前了解警告／风险；谢航辉说未必掌握全部；洪燕扩展表认为此前报告未送达、此前无责。</td><td>列为第2问实质分歧，不统一其事实前提。</td></tr><tr><td>洪燕稿件层次</td><td>前三问有“本人作答”及扩展论述；第4问先留有“尚未提供你的作答”字样，后附完整分析。</td><td>本人作答优先呈现；其余标作文件扩展内容，第4问不冒认为独立本人作答。</td></tr><tr><td>黄睿稿件文字</td><td>第2问写“各部门均为出现明显失责情况”，存在明显语病。</td><td>结合CEO归责语境暂按“均未出现”理解，保留歧义并提供原文。</td></tr><tr><td>主观评分与概率</td><td>洪燕：难度9/10；另一行动路径约30%。</td><td>只归属该稿，不当作统一量表或统计概率。</td></tr><tr><td>预测与事后材料</td><td>洪燕包含1982年9月泰诺类比、后续监管／1987年结局；廖磊以“最终结果”表述第4问。</td><td>保留为原稿补充与事后口吻，不作为6月28日可知信息或已核定结局。</td></tr><tr><td>案例编号</td><td>廖磊文件写392-084，参考聊天有392-085；本次未提供原案例正文用于确认。</td><td>不在展示标题中采用未经确认的编号。</td></tr></tbody></table></div><div class="notice"><h3>原文保真与展示方式</h3><p>DOCX提取正文与表格文字；PDF提取第1页文字；TXT按UTF-8读取。原文弹窗保留文字内容，表格按文档阅读顺序展开；若需核对原始排版，可下载对应原始文件。</p><p>“展示模式”放大正文、收起页首；每题上方切换三项内容。使用“打印完整归纳”可一次输出四题全部三项内容及核对说明，无须逐个标签打印。</p><button class="download-all" onclick="downloadStandalone()">下载离线网页 ↓</button> <button class="present-btn" onclick="printAll()">打印完整归纳</button><p>离线版内置全部归纳及原文文字，可直接双击打开；原始DOCX／PDF／TXT文件下载需要在线页面或随附网页文件夹。</p></div>`;}
function render(){renderSidebar();let m=document.getElementById('main');if(current===0){m.innerHTML=overview();return}if(current===5){m.innerHTML=sourcePage();return}let q=QUESTIONS[current-1];m.innerHTML=`<section class="page-head"><div class="chapter"><span class="big">0${q.id}</span><h2>${q.title}</h2></div><p class="lead">${q.lead}</p></section><div class="tabs" role="tablist" aria-label="归纳维度">${['各位同学的观点','共同认同的点','不同看法'].map((x,i)=>`<button id="tab-${i}" class="tab ${i===dimension?'active':''}" role="tab" aria-selected="${i===dimension}" aria-controls="panel" onclick="setDimension(${i})">${x}<span class="count">${[q.views.length,q.common.length,q.diff.length][i]}</span></button>`).join('')}</div><div class="section-intro"><p>${['按原稿逐人归纳，特别主张和理由一并保留。','注明共同点的支持范围；多数观点与八人一致分开呈现。','既保留实质分歧，也说明哪些只是侧重点或展开程度不同。'][dimension]}</p><div class="reading-key"><span>归纳</span><span>可核对原文</span></div></div><section role="tabpanel" id="panel" aria-labelledby="tab-${dimension}">${[personCards,commonCards,diffCards][dimension](q)}</section><nav class="pager" aria-label="翻页"><button onclick="go(${current-1})">← ${current===1?'讨论总览':QUESTIONS[current-2].short}</button><span>问题 ${q.id} / 4</span><button onclick="go(${current===4?5:current+1})">${current===4?'来源与核对':QUESTIONS[current].short} →</button></nav>`;}
function go(id,scroll=true){current=Math.max(0,Math.min(5,id));dimension=0;setHash();render();if(scroll){document.getElementById('main').scrollIntoView({behavior:'instant',block:'start'});document.getElementById('main').focus({preventScroll:true})}}
function setDimension(i){dimension=i;setHash();render();document.getElementById('tab-'+i)?.focus({preventScroll:true});}
function setHash(){history.replaceState(null,'',`#${current===0?'overview':current===5?'sources':'q'+current+'-'+['voices','common','differences'][dimension]}`)}
function fromHash(){let h=location.hash;if(h==='#sources'){current=5;dimension=0}else if(/^#q[1-4]/.test(h)){current=Number(h[2]);let d=h.split('-')[1];dimension=Math.max(0,['voices','common','differences'].indexOf(d))}else{current=0;dimension=0}render()}
function showSource(n){let s=sourceFor(n);document.getElementById('source-title').textContent=n+' · 完整原文';document.getElementById('source-file').textContent=s.file;document.getElementById('source-body').innerHTML=`<p class="source-warning">以下为署名文件的文字提取，保留原稿判断、数字和措辞。${n==='洪燕'?'该稿含“本人作答”、扩展分析及第4问待补标记，请结合来源核对说明阅读。':'表格按阅读顺序展开，原始排版可下载文件核对。'}</p><a class="source-download" href="sources/${encodeURIComponent(s.file)}" download>下载原始${s.file.split('.').pop().toUpperCase()}文件 ↓</a><pre class="raw-source">${esc(s.text)}</pre>`;let d=document.getElementById('source-dialog');if(!d.open)d.showModal();d.scrollTop=0;}
document.getElementById('source-dialog').addEventListener('click',e=>{if(e.target===e.currentTarget){let r=e.currentTarget.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.currentTarget.close()}});
async function togglePresentation(){let on=document.body.classList.toggle('presentation');let b=document.getElementById('presentation');b.textContent=on?'退出展示 ↙':'展示模式 ↗';b.setAttribute('aria-pressed',String(on));if(on){try{await document.documentElement.requestFullscreen()}catch{}}else if(document.fullscreenElement){try{await document.exitFullscreen()}catch{}}}
function printAll(){document.getElementById('print-area').innerHTML=`<section class="print-cover"><div class="eyebrow">Business Ethics · Discussion Review</div><h1>比纳案例<br>八人观点对照</h1><p>8位同学 · 4个问题 · 32组回答<br>个人观点 / 共同认同 / 不同看法</p><p>${PEOPLE.join('　')}<br>2026年10月28日</p><p>根据8份署名原稿归纳。学生观点不等于已核定事实；<br>共同点标明支持范围，未提及不等于反对。</p></section>${QUESTIONS.map(q=>`<section class="print-chapter"><h2>0${q.id} ${q.title}</h2><p>${q.lead}</p><h3>第一项 · 各位同学的观点</h3>${personCards(q)}<h3>第二项 · 共同认同的点</h3>${commonCards(q)}<h3>第三项 · 不同看法</h3>${diffCards(q)}</section>`).join('')}<section class="print-sources">${sourcePage().replace(/<button[\s\S]*?<\/button>/g,'')}</section>`;window.print()}
function downloadStandalone(){let root=document.documentElement.cloneNode(true);root.querySelector('body').classList.remove('presentation');for(let id of ['main','sidebar','print-area','source-body'])root.querySelector('#'+id).innerHTML='';root.querySelector('#source-dialog').removeAttribute('open');let toggle=root.querySelector('#presentation');toggle.textContent='展示模式 ↗';toggle.setAttribute('aria-pressed','false');let html='<!doctype html>\n'+root.outerHTML;let blob=new Blob([html],{type:'text/html;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='比纳案例_八人观点对照.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
window.addEventListener('hashchange',fromHash);document.addEventListener('keydown',e=>{if(document.getElementById('source-dialog').open)return;if(e.target.tagName==='INPUT')return;if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();go(Math.min(current+1,5))}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();go(Math.max(current-1,0))}});fromHash();
</script>
</body></html>
